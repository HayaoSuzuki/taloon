# Keep local checks aligned with CI.
default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt (workspace)"
language = "system"
entry = "cargo fmt --all -- --check"
pass_filenames = false
files = '(\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)\.?rustfmt\.toml$|(^|/)\.?clippy\.toml$|^rust-toolchain(\.toml)?$|^\.cargo/|^prek\.toml$)'

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy (workspace)"
language = "system"
entry = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"
pass_filenames = false
files = '(\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)\.?rustfmt\.toml$|(^|/)\.?clippy\.toml$|^rust-toolchain(\.toml)?$|^\.cargo/|^prek\.toml$)'

[[repos.hooks]]
id = "documentation"
name = "Documentation links and OKF"
language = "system"
entry = "uv run --frozen --only-group docs --only-group release python -m tools.check_docs"
pass_filenames = false
files = '(\.md$|^tools/.*\.py$|^tests/.*\.py$|^pyproject\.toml$|^uv\.lock$|^\.python-version$|^mkdocs\.yml$|^prek\.toml$)'

[[repos.hooks]]
id = "user-docs"
name = "User documentation (strict build)"
language = "system"
entry = "uv run --frozen --only-group docs --only-group release mkdocs build --strict"
pass_filenames = false
files = '(^docs/user/|^mkdocs\.yml$|^pyproject\.toml$|^uv\.lock$|^\.python-version$|^prek\.toml$)'

[[repos.hooks]]
id = "ruff-format"
name = "Python formatting"
language = "system"
entry = "uv run --frozen --only-group docs --only-group release ruff format --check ."
pass_filenames = false
files = '(\.py$|^pyproject\.toml$|^uv\.lock$|^\.python-version$|^prek\.toml$)'

[[repos.hooks]]
id = "ruff-lint"
name = "Python lint"
language = "system"
entry = "uv run --frozen --only-group docs --only-group release ruff check --no-fix ."
pass_filenames = false
files = '(\.py$|^pyproject\.toml$|^uv\.lock$|^\.python-version$|^prek\.toml$)'

[[repos.hooks]]
id = "ty"
name = "Python type checking"
language = "system"
entry = "uv run --frozen --only-group docs --only-group release ty check"
pass_filenames = false
files = '(\.py$|^pyproject\.toml$|^uv\.lock$|^\.python-version$|^prek\.toml$)'
