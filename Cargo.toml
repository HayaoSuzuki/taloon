[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Elastic-2.0"
repository = "https://github.com/HayaoSuzuki/taloon"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[package]
name = "taloon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "License checking for uv-resolved Python dependencies"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
spdx = "0.13.4"
pep440_rs = "0.7.3"
sha2 = "0.10.9"
url = "2.5"
time = { version = "0.3.47", features = ["parsing", "formatting", "serde"] }
thiserror = "2.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }

[dev-dependencies]
proptest = "1.12"
tempfile = "3.0"

[profile.release]
lto = "thin"
strip = true
