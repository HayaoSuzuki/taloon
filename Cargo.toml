[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Elastic-2.0"
repository = "https://github.com/HayaoSuzuki/taloon"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[package]
name = "taloon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "License checking for uv-resolved Python dependencies"
publish = false

[lints]
workspace = true

[profile.release]
lto = "thin"
strip = true
