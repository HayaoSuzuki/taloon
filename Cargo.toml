[workspace]
members = [".", "crates/taloon-decisions"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Elastic-2.0"
repository = "https://github.com/HayaoSuzuki/taloon"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(creusot)', 'cfg(coverage_nightly)'] }

[package]
name = "taloon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "License checking for uv-resolved Python dependencies"
publish = false

[lints]
workspace = true

[dependencies]
taloon-decisions = { path = "crates/taloon-decisions", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "1.1.2"
spdx = { version = "0.13.4", features = ["text"] }
pep440_rs = "0.7.3"
sha2 = "0.10.9"
url = "2.5"
time = { version = "0.3.47", features = ["parsing", "formatting", "serde"] }
thiserror = "2.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }

tempfile = "3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
shlex = "2.0.1"
html5ever = "0.35.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
proptest = "1.12"
rstest = { version = "0.28.0", default-features = false }

[profile.release]
lto = "thin"
strip = true
