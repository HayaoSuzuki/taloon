name: taloon-github
runtime: yaml
description: GitHub main protection for HayaoSuzuki/taloon
backend:
  url: file://./state

resources:
  github:
    type: pulumi:providers:github
    options:
      version: 6.15.0
    properties:
      owner: HayaoSuzuki

  main:
    type: github:index/repositoryRuleset:RepositoryRuleset
    options:
      provider: ${github}
      version: 6.15.0
      protect: true
    properties:
      repository: taloon
      name: main-protection
      target: branch
      enforcement: active
      bypassActors: []
      conditions:
        refName:
          includes: [refs/heads/main]
          excludes: []
      rules:
        deletion: true
        nonFastForward: true
        pullRequest:
          requiredApprovingReviewCount: 0
          dismissStaleReviewsOnPush: false
          requireCodeOwnerReview: false
          requireLastPushApproval: false
          requiredReviewThreadResolution: true
        requiredStatusChecks:
          # Personal repositories cannot use merge queues. Check against current main.
          strictRequiredStatusChecksPolicy: true
          doNotEnforceOnCreate: false
          # Include prerequisites: skipped dependents must not hide a failed prepare.
          # Bind exact PR job names to GitHub Actions, not an arbitrary status sender.
          requiredChecks:
            - context: Rust quality and tests
              integrationId: 15368
            - context: Rust randomized order (nightly-2026-10-08)
              integrationId: 15368
            - context: Python formatting, lint and types
              integrationId: 15368
            - context: Workflow lint
              integrationId: 15368
            - context: Lean proofs and generated corpus freshness
              integrationId: 15368
            - context: Bounded parser and inspection fuzz smoke
              integrationId: 15368
            - context: Rust dependency audit and policy
              integrationId: 15368
            - context: Check documentation and build user guide
              integrationId: 15368
            - context: prepare
              integrationId: 15368
            - context: Wheel and uv smoke (linux-x86_64)
              integrationId: 15368
            - context: Wheel and uv smoke (macos-aarch64)
              integrationId: 15368
            - context: Wheel and uv smoke (windows-x86_64)
              integrationId: 15368
            - context: validate
              integrationId: 15368

  # Adopt existing identity, but manage only merged-branch deletion here.
  # Keep every other repository input from refreshed state, including security.
  repositorySettings:
    type: github:index/repository:Repository
    options:
      provider: ${github}
      version: 6.15.0
      protect: true
      ignoreChanges:
        - allowAutoMerge
        - allowForking
        - allowMergeCommit
        - allowRebaseMerge
        - allowSquashMerge
        - allowUpdateBranch
        - archiveOnDestroy
        - archived
        - autoInit
        - defaultBranch
        - description
        - etag
        - fork
        - gitignoreTemplate
        - hasDiscussions
        - hasDownloads
        - hasIssues
        - hasProjects
        - hasWiki
        - homepageUrl
        - ignoreVulnerabilityAlertsDuringRead
        - isTemplate
        - licenseTemplate
        - mergeCommitMessage
        - mergeCommitTitle
        - name
        - pages
        - private
        - securityAndAnalysis
        - sourceOwner
        - sourceRepo
        - squashMergeCommitMessage
        - squashMergeCommitTitle
        - template
        - topics
        - visibility
        - vulnerabilityAlerts
        - webCommitSignoffRequired
    properties:
      name: taloon
      deleteBranchOnMerge: true

  vulnerabilityAlerts:
    type: github:index/repositoryVulnerabilityAlerts:RepositoryVulnerabilityAlerts
    options:
      provider: ${github}
      version: 6.15.0
      protect: true
    properties:
      repository: ${repositorySettings.name}
      enabled: true

  dependabotUpdates:
    type: github:index/repositoryDependabotSecurityUpdates:RepositoryDependabotSecurityUpdates
    options:
      provider: ${github}
      version: 6.15.0
      protect: true
      dependsOn: ["${vulnerabilityAlerts}"]
    properties:
      repository: ${repositorySettings.name}
      enabled: true

  releaseTags:
    type: github:index/repositoryRuleset:RepositoryRuleset
    options:
      provider: ${github}
      version: 6.15.0
      protect: true
    properties:
      repository: taloon
      name: release-tag-protection
      target: tag
      enforcement: active
      bypassActors: []
      conditions:
        refName:
          includes: [refs/tags/v*]
          excludes: []
      # New version tags remain creatable; published identities cannot move/disappear.
      rules:
        update: true
        deletion: true

  releaseState:
    type: github:index/repositoryRuleset:RepositoryRuleset
    options:
      provider: ${github}
      version: 6.15.0
      protect: true
    properties:
      repository: taloon
      name: release-state-protection
      target: branch
      enforcement: active
      bypassActors: []
      conditions:
        refName:
          includes: [refs/heads/taloon-release-state]
          excludes: []
      # Atomic CAS reservations advance directly; no PR/check gate on this state ref.
      rules:
        deletion: true
        nonFastForward: true

outputs:
  rulesetId: ${main.rulesetId}
  releaseTagRulesetId: ${releaseTags.rulesetId}
  releaseStateRulesetId: ${releaseState.rulesetId}
