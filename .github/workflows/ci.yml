name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Install local hook integration prerequisite
        run: uv tool install prek==0.5.7
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Local hook integration and Rust tests
        run: cargo test --locked --workspace --all-features
      - name: Real TLS failure and timeout fixture
        run: cargo test --locked --bin taloon real_https_transport_rejects_bad_tls_and_times_out -- --ignored
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Install workflow parser prerequisite
        run: uv sync --frozen --only-group docs --no-install-project
      - run: tools/check_workflows.sh
      - run: uvx zizmor==1.30.1 --no-online-audits --min-severity low .github/workflows

  formal:
    name: Lean proofs and generated corpus freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Lean 4.32.2
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.32.2/lean-4.32.2-linux.tar.zst \
            --output "$RUNNER_TEMP/lean.tar.zst"
          echo "5f2069e6f5db73780f374ccb49ce8ea649aa20a0cebf0116816744c999ce72aa  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/taloon-lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/taloon-lean"
          echo "$RUNNER_TEMP/taloon-lean/bin" >> "$GITHUB_PATH"
      - name: Build proofs within the recorded command deadline
        working-directory: formal/TaloonOracle
        run: timeout 20s lake build TaloonOracle generate_corpus
      - name: Check generated expectations and sensitivity witnesses
        run: |
          formal/TaloonOracle/.lake/build/bin/generate_corpus --stats
          formal/TaloonOracle/.lake/build/bin/generate_corpus --check tests/fixtures/oracle/policy.jsonl

  fuzz:
    name: Bounded parser and inspection fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned compiler and fuzz runner
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-10-08 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run every bounded target
        run: |
          for target in policy uv_lock metadata wheel sdist inspection; do
            cargo +nightly-2026-10-08 fuzz run "$target" -- -runs=1000 -max_len=4096
          done
      - name: Retain crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 7
