name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quint:
    name: Quint behavioral models
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Quint tools
        working-directory: formal/quint
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify invariants and mutant counterexamples
        run: |
          export PATH="${JAVA_HOME_21_X64:?Java 21 is required}/bin:$PATH"
          export QUINT_HOME="$RUNNER_TEMP/quint-home"
          quint="$GITHUB_WORKSPACE/formal/quint/node_modules/.bin/quint"
          cd "$RUNNER_TEMP" || exit 1
          for spec in \
            'aggregation Aggregation Precedence' \
            'observation Observation ObservationContract' \
            'acquisition Acquisition AcquisitionContract' \
            'inspection Inspection ExitContract' \
            'lifecycle Lifecycle LifecycleContract' \
            'index_concurrency IndexConcurrency SnapshotContract' \
            'shared_cache SharedCache PublicationContract' \
            'extras Extras ExtrasContract' \
            'locked_forks LockedForks UniqueIdentity' \
            'path_ties PathTies CanonicalPath' \
            'scoped_policy ScopedPolicy ScopeContract' \
            'unused_policy UnusedPolicy WarningContract'; do
            read -r file main invariant <<< "$spec"
            model="$GITHUB_WORKSPACE/formal/quint/$file.qnt"
            "$quint" typecheck "$model"
            "$quint" verify "$model" --backend=tlc --main "$main" --invariants "$invariant"
            log="$RUNNER_TEMP/$file-mutant.log"
            if "$quint" verify "$model" --backend=tlc --main "${main}Mutant" --invariants "$invariant" >"$log" 2>&1; then
              cat "$log"
              echo "The $file mutant unexpectedly passed"
              exit 1
            fi
            cat "$log"
            grep -E '^Error: Invariant q_inv is violated([.]| by the initial state:)$' "$log"
          done
      - name: Replay Quint traces through Rust acquisition and inspection
        run: |
          rustup toolchain install
          bash formal/quint/replay.sh "$GITHUB_WORKSPACE/formal/quint/node_modules/.bin/quint"

  rust:
    name: Rust quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install local hook integration prerequisite
        run: uv tool install prek==0.5.11
      - name: Install repository Rust toolchain
        run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Local hook integration and Rust tests
        run: cargo test --locked --workspace --all-features
      - name: Real TLS failure and timeout fixture
        run: cargo test --locked --bin taloon real_https_transport_rejects_invalid_connection -- --ignored
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  rust-shuffle:
    name: Rust randomized order (nightly-2026-11-23)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install local hook integration prerequisite
        run: uv tool install prek==0.5.11
      - name: Install pinned nightly Rust
        run: rustup toolchain install nightly-2026-11-23 --profile minimal
      - name: Run Rust tests in randomized order
        run: cargo +nightly-2026-11-23 test --locked --workspace --all-features -- -Z unstable-options --shuffle

  python-quality:
    name: Python formatting, lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install Python tooling
        run: uv sync --frozen --only-group docs --only-group release --no-install-project
      - run: uv run --frozen --no-sync ruff format --check .
      - run: uv run --frozen --no-sync ruff check --no-fix .
      - run: uv run --frozen --no-sync ty check

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Install workflow parser prerequisite
        run: uv sync --frozen --only-group docs --no-install-project
      - run: tools/check_workflows.sh
      - run: uvx zizmor==1.33.1 --no-online-audits --min-severity low .github/workflows

  formal:
    name: Lean proofs and generated corpus freshness
    permissions:
      contents: read
      packages: read
      attestations: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Lean 4.36.0
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.36.0/lean-4.36.0-linux.tar.zst \
            --output "$RUNNER_TEMP/lean.tar.zst"
          echo "2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/taloon-lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/taloon-lean"
          echo "$RUNNER_TEMP/taloon-lean/bin" >> "$GITHUB_PATH"
      - name: Build proofs within the recorded command deadline
        working-directory: formal/TaloonOracle
        run: timeout 20s lake build TaloonOracle generate_corpus generate_index generate_selection
      - name: Check generated expectations and sensitivity witnesses
        run: |
          formal/TaloonOracle/.lake/build/bin/generate_corpus --stats
          formal/TaloonOracle/.lake/build/bin/generate_corpus --check tests/fixtures/oracle/policy.jsonl
          formal/TaloonOracle/.lake/build/bin/generate_index --check tests/fixtures/oracle/index.jsonl
          formal/TaloonOracle/.lake/build/bin/generate_selection --check tests/fixtures/oracle/selection.jsonl
      # Keep the existing required status context; both formal checks must pass.
      - name: Check bounded Creusot build orchestration
        run: |
          bash formal/creusot/test-build-image.sh
          bash formal/creusot/test-prepare-image.sh
          bash formal/creusot/test-registry-image.sh
          bash formal/creusot/test-publish-image.sh
      - name: Select the reviewed environment pin
        id: environment
        run: |
          mode=$(bash formal/creusot/registry-image.sh formal/creusot/image.pin formal/creusot/build-image.sh --mode)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Authenticate for the pinned registry environment
        if: steps.environment.outputs.mode == 'registry'
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Restore exact pinned Creusot image
        if: steps.environment.outputs.mode == 'bootstrap'
        id: creusot-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/taloon-creusot-image.tar
          key: taloon-creusot-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('formal/creusot/build-image.sh', 'formal/creusot/prepare-image.sh', 'formal/creusot/registry-image.sh', 'formal/creusot/image.pin') }}
      - name: Prepare and validate checksum-pinned Creusot environment
        env:
          GH_TOKEN: ${{ github.token }}
          CREUSOT_CACHE_HIT: ${{ steps.creusot-image.outputs.cache-hit }}
        run: timeout 1200s bash formal/creusot/prepare-image.sh "$RUNNER_TEMP/taloon-creusot-image.tar" "${CREUSOT_CACHE_HIT:-false}" formal/creusot/image.pin
      - name: Save validated pinned Creusot image
        if: steps.environment.outputs.mode == 'bootstrap' && steps.creusot-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/taloon-creusot-image.tar
          key: ${{ steps.creusot-image.outputs.cache-primary-key }}
      - name: Prove production observation and verdict contracts
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target/creusot taloon-creusot:local \
            timeout 600s formal/creusot/verify.sh
      - name: Reject compiling contract mutations
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target/creusot taloon-creusot:local \
            timeout 600s formal/creusot/sensitivity.sh
      - name: Retain Creusot diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: creusot-contracts
          path: formal/creusot/reports
          if-no-files-found: ignore
          retention-days: 7

  fuzz:
    name: Bounded parser and inspection fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned compiler and fuzz runner
        run: |
          rustup toolchain install
          rustup toolchain install nightly-2026-11-23 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run every bounded target
        run: |
          for target in policy uv_lock wheel sdist inspection; do
            cargo +nightly-2026-11-23 fuzz run "$target" -- -runs=1000 -max_len=4096
          done
          cargo +nightly-2026-11-23 fuzz run metadata -- -runs=1000 -max_len=32768
      - name: Retain crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 7
